[build]
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
# Run pending Alembic migrations before starting uvicorn. If migrations
# fail (unreachable DB, conflict), the container exits and Railway
# restarts it — safer than booting the app against a stale schema.
startCommand = "alembic upgrade head && python -c 'import os,uvicorn;uvicorn.run(\"src.main:app\",host=\"0.0.0.0\",port=int(os.environ.get(\"PORT\",8000)),workers=2)'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
